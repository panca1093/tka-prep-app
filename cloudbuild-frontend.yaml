steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://masukelas-api-1007334190327.asia-southeast2.run.app/api/v1'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend:latest'
      - '.'
    timeout: '600s'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'masukelas-frontend'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--allow-unauthenticated'
      - '--port'
      - '80'
      - '--project'
      - '$PROJECT_ID'

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend:$COMMIT_SHA'
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/masukelas/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
