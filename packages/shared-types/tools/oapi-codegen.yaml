# oapi-codegen configuration
# Run from apps/backend: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen \
#   -config ../../packages/shared-types/tools/oapi-codegen.yaml \
#   ../../packages/shared-types/openapi.yaml
# Output path is relative to CWD (apps/backend).
package: api
output: internal/api/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
