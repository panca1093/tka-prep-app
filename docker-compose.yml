services:
  postgres:
    image: postgres:16-alpine
    container_name: tkaprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tkaprep
      POSTGRES_PASSWORD: tkaprep
      POSTGRES_DB: tkaprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkaprep"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: tkaprep-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://tkaprep:tkaprep@postgres:5432/tkaprep?sslmode=disable",
        "up"
      ]
    restart: on-failure

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: tkaprep-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tkaprep:tkaprep@postgres:5432/tkaprep?sslmode=disable
      JWT_SECRET: dev-secret-change-in-prod
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      PORT: "8080"
      LOG_LEVEL: debug
      FRONTEND_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: gcs
      GCS_BUCKET: masuk_kelas
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs_credentials
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - ${HOME}/.config/gcloud/application_default_credentials.json:/run/secrets/gcs_credentials:ro

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: tkaprep-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
